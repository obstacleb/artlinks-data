name: Build Syzygy Events CSV

on:
  workflow_dispatch:        # run manually from the Actions tab
  schedule:
    - cron: "0 8 * * 1"    # every Monday at 8am UTC (re-generates weekly)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape_syzygy.py

      - name: Commit updated CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add syzygy_events.csv
          git diff --cached --quiet || git commit -m "chore: update syzygy_events.csv [skip ci]"
          git push
